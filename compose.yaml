services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SCHEDULE_SOURCE: ${SCHEDULE_SOURCE:-excel}
      DATABASE_PATH: ${DATABASE_PATH:-/data/schedule.sqlite3}
      UPDATE_INTERVAL_SECONDS: ${UPDATE_INTERVAL_SECONDS:-14400}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-31457280}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      SYNC_WEEKS: ${SYNC_WEEKS:-4}
      EXCEL_SOURCE_URL: ${EXCEL_SOURCE_URL:-https://misis.ru/students/}
      EXCEL_LINK_PATTERN: ${EXCEL_LINK_PATTERN:-}
      EXCEL_UPPER_ROW_WEEK: ${EXCEL_UPPER_ROW_WEEK:-odd}
      EXCEL_TERM_START: ${EXCEL_TERM_START:-2026-09-01}
      EXCEL_TERM_END: ${EXCEL_TERM_END:-2027-01-31}
      EDU_API_URL: ${EDU_API_URL:-https://edu.misis.ru/schedule}
      EDU_FILIAL: ${EDU_FILIAL:-MOSCOW}
      EDU_GROUPS: ${EDU_GROUPS:-МПИ-26-1-1,МПИ-26-1-2}
      EDU_REQUEST_DELAY_SECONDS: ${EDU_REQUEST_DELAY_SECONDS:-0.25}
    volumes:
      - schedule_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NUXT_API_BASE: ${NUXT_API_BASE:-http://backend:8000}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  schedule_data:
