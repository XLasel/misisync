services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-31457280}
      EDU_API_URL: ${EDU_API_URL:-https://edu.misis.ru/schedule}
      EDU_FILIAL: ${EDU_FILIAL:-MOSCOW}
      EDU_GROUPS: ${EDU_GROUPS:-}
      EDU_REQUEST_DELAY_SECONDS: ${EDU_REQUEST_DELAY_SECONDS:-0.25}
      EDU_CATALOG_TTL_SECONDS: ${EDU_CATALOG_TTL_SECONDS:-3600}
      EDU_SCHEDULE_TTL_SECONDS: ${EDU_SCHEDULE_TTL_SECONDS:-900}
      EDU_SCHEDULE_CACHE_MAX_ENTRIES: ${EDU_SCHEDULE_CACHE_MAX_ENTRIES:-256}
      SCHEDULE_RATE_LIMIT_PER_MINUTE: ${SCHEDULE_RATE_LIMIT_PER_MINUTE:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NUXT_API_BASE: ${NUXT_API_BASE:-http://backend:8000}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
